<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Mentari Mod — Pet Playground</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&family=Roboto:wght@400;500;700&display=swap" />
    <style>
      :root {
        --mm-primary: #ffb871; --mm-on-primary: #502400;
        --mm-primary-container: #723a00; --mm-on-primary-container: #ffdcbe;
        --mm-secondary-container: #55442f; --mm-on-secondary-container: #f5dfcb;
        --mm-tertiary-container: #004a75; --mm-on-tertiary-container: #cde5ff;
        --mm-error-container: #8c1d18; --mm-on-error-container: #f9dedc;
        --mm-surface: #141218; --mm-on-surface: #e6e0e9;
        --mm-on-surface-variant: #cac4d0;
        --mm-surface-low: #1d1b20; --mm-surface-container: #211f26;
        --mm-surface-high: #2b2930; --mm-surface-highest: #36343b;
        --mm-outline-variant: #49454f;
        --mm-font: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --mm-ease-emphasized: cubic-bezier(.05,.7,.1,1);
      }
      * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { font-family: var(--mm-font); }
      .ms { font-family: 'Material Symbols Rounded'; font-size: 20px; font-style: normal; font-weight: 400; line-height: 1; display: inline-flex; align-items: center; vertical-align: middle; user-select: none; letter-spacing: normal; text-transform: none; white-space: nowrap; }
      #world {
        position: relative; width: 100vw; height: 100vh; overflow: hidden;
        background: linear-gradient(to bottom, #1b2340 0%, #2b3a67 45%, #3f5a3a 45%, #243d22 100%);
        transition: background 1.8s cubic-bezier(0.65, 0, 0.35, 1);
      }
      #world.day {
        background: linear-gradient(to bottom, #82d4ff 0%, #d9f5ff 55%, #c9e9a5 55%, #91c96d 100%);
      }
      .sky { position: absolute; inset: 0; pointer-events: none; }
      .sun {
        position: absolute; width: 105px; height: 105px; left: 78%; top: 12%;
        border-radius: 50%; background: #ffe58a;
        box-shadow: 0 0 35px rgba(255,224,100,.7), 0 0 90px rgba(255,218,80,.35);
        transform: translate(-50%, 0); opacity: 0;
        transition: top 2.2s cubic-bezier(.65,0,.35,1), opacity 1.3s ease;
      }
      #world.day .sun { opacity: 1; }
      #world.night .sun { left: 22%; top: 78%; opacity: 0; }
      .moon {
        position: absolute; width: 82px; height: 82px; right: 13%; top: 12%;
        border-radius: 50%; background: #fff8d7;
        box-shadow: 0 0 35px rgba(255,255,220,.35), 0 0 80px rgba(255,255,220,.15);
        opacity: 1; transition: top 2.2s cubic-bezier(.65,0,.35,1), opacity 1.5s ease;
      }
      #world.day .moon { top: 75%; opacity: 0; }
      .stars { position: absolute; inset: 0; opacity: 1; transition: opacity 2s ease; }
      #world.day .stars { opacity: 0; }
      .star {
        position: absolute; width: 3px; height: 3px; border-radius: 50%;
        background: white; box-shadow: 0 0 5px rgba(255,255,255,.8);
        animation: twinkle 2s ease-in-out infinite alternate;
      }
      .star.small { width: 2px; height: 2px; }
      .star.big { width: 4px; height: 4px; }
      @keyframes twinkle { from { opacity: .25; transform: scale(.75); } to { opacity: 1; transform: scale(1.25); } }
      .cloud {
        position: absolute; width: 140px; height: 38px; border-radius: 50px;
        background: rgba(255,255,255,.18); transition: opacity 1.5s ease;
      }
      .cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
      .cloud::before { width: 55px; height: 55px; left: 20px; bottom: 5px; }
      .cloud::after { width: 70px; height: 70px; right: 20px; bottom: 0; }
      #world.day .cloud { background: rgba(255,255,255,.65); }
      .cloud-1 { top: 15%; left: -180px; animation: cloudMove 70s linear infinite; }
      .cloud-2 { top: 29%; left: -250px; transform: scale(.7); animation: cloudMove 95s linear infinite; animation-delay: -20s; }
      @keyframes cloudMove { to { transform: translateX(calc(100vw + 500px)); } }
      .ground {
        position: absolute; left: 0; right: 0; bottom: 0; height: 43%;
        background: linear-gradient(to bottom, #314b38, #182a21);
        transition: background 1.8s ease;
      }
      #world.day .ground { background: linear-gradient(to bottom, #b9df8e, #82b85d); }
      .ground-wave { position: absolute; top: -58px; left: 0; width: 100%; height: 60px; pointer-events: none; }
      .ground-wave path { fill: #314b38; transition: fill 1.8s ease; }
      #world.day .ground-wave path { fill: #b9df8e; }
      .grass-blades { position: absolute; bottom: 0; left: 0; right: 0; height: 28px; pointer-events: none; overflow: hidden; }
      .blade { position: absolute; bottom: 0; width: 4px; border-radius: 4px 4px 2px 2px; transform-origin: bottom center; animation: sway 2.4s ease-in-out infinite alternate; filter: brightness(.6); }
      #world.day .blade { filter: none; }
      .blade.short { height: 12px; background: #5aab38; }
      .blade.mid { height: 18px; background: #4d9e30; }
      .blade.tall { height: 24px; background: #3f8f24; }
      @keyframes sway { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
      .rock {
        position: absolute; bottom: 14px; border-radius: 50% 55% 48% 52% / 55% 50% 58% 45%;
        background: linear-gradient(135deg, #5a605a 0%, #434844 60%, #333833 100%);
        box-shadow: inset -3px -3px 6px rgba(0,0,0,.3), 0 3px 6px rgba(0,0,0,.3);
        pointer-events: none; transition: filter 1.8s ease;
      }
      #world.day .rock { background: linear-gradient(135deg, #b0b5b0 0%, #8a9088 60%, #6e756c 100%); }
      .rock.sm { width: 22px; height: 16px; }
      .rock.md { width: 34px; height: 24px; }
      .rock.lg { width: 48px; height: 32px; }
      .pet { position: absolute; left: 0; bottom: 19%; z-index: 10; cursor: pointer; transform-origin: center bottom; transition: bottom .3s ease; display: flex; align-items: center; justify-content: center; }
      .pet img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
      .pet .emoji-fallback { font-size: 64px; line-height: 1; pointer-events: none; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
      .shadow { position: absolute; height: 13px; bottom: 20%; border-radius: 50%; background: rgba(0,0,0,.35); filter: blur(3px); transform: translateX(-50%); z-index: 4; }
      .pet.clicked { animation: clicked .45s ease; }
      @keyframes clicked {
        0% { transform: scaleX(var(--flip, 1)) scaleY(1); }
        35% { transform: scaleX(var(--flip, 1)) translateY(-9px) scaleY(.95); }
        65% { transform: scaleX(var(--flip, 1)) translateY(2px) scaleY(1.03); }
        100% { transform: scaleX(var(--flip, 1)) scaleY(1); }
      }
      .reaction {
        position: absolute; z-index: 50; padding: 8px 14px; border-radius: 16px 16px 16px 4px;
        background: var(--mm-surface-highest); color: var(--mm-on-surface);
        font-size: 13px; font-weight: 500; pointer-events: none; white-space: nowrap;
        opacity: 0; transform: translate(-50%, 8px) scale(.85);
        transition: opacity .25s ease, transform .25s var(--mm-ease-emphasized);
        box-shadow: 0 6px 20px rgba(0,0,0,.4);
      }
      .reaction.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
      .stage-tag {
        position: absolute; top: 16px; left: 16px; z-index: 100;
        display: flex; align-items: center; gap: 8px; padding: 10px 16px 10px 12px;
        border-radius: 16px; background: rgba(20,18,24,.72); color: var(--mm-on-surface);
        font-size: 13px; backdrop-filter: blur(12px); border: 1px solid var(--mm-outline-variant);
      }
      .stage-tag .ms { color: var(--mm-primary); font-size: 20px; }
      .stage-tag small { display: block; font-size: 10px; color: var(--mm-on-surface-variant); }
      .controls { position: absolute; right: 16px; bottom: 16px; z-index: 100; display: flex; gap: 10px; }
      .mm-fab {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        min-width: 48px; height: 48px; padding: 0 16px; border-radius: 16px; border: 0; cursor: pointer;
        background: var(--mm-primary-container); color: var(--mm-on-primary-container);
        font: inherit; font-size: 13px; font-weight: 500;
        box-shadow: 0 4px 12px rgba(0,0,0,.4);
        transition: transform .3s var(--mm-ease-emphasized), box-shadow .2s;
      }
      .mm-fab:hover { transform: translateY(-2px); }
      .mm-fab .ms { font-family: 'Material Symbols Rounded'; font-size: 22px; line-height: 1; display: inline-flex; }
      .mm-fab-tonal { background: var(--mm-surface-highest); color: var(--mm-on-surface); }
      /* configurator dialog */
      .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
      .scrim.open { display: flex; }
      .dialog {
        width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
        background: var(--mm-surface-container); color: var(--mm-on-surface);
        border-radius: 28px; padding: 24px;
        animation: rise .3s var(--mm-ease-emphasized);
      }
      @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96); } }
      .dialog h2 { margin: 0 0 2px; font-size: 22px; font-weight: 400; }
      .dialog .sub { font-size: 13px; color: var(--mm-on-surface-variant); margin-bottom: 16px; }
      .pet-card { background: var(--mm-surface-high); border: 1px solid var(--mm-outline-variant); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
      .pet-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .pet-card-head strong { flex: 1; font-size: 14px; }
      .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
      .field label { font-size: 11px; font-weight: 500; letter-spacing: .4px; color: var(--mm-on-surface-variant); text-transform: uppercase; }
      .field input, .field select {
        font: inherit; font-size: 13px; color: var(--mm-on-surface);
        background: var(--mm-surface-highest); border: 1px solid var(--mm-outline-variant);
        border-radius: 8px; padding: 8px 10px; outline: none; width: 100%;
      }
      .field .mm-split { width: 100%; }
      .mm-split { position: relative; display: inline-flex; width: 100%; min-height: 40px; border-radius: 9999px; overflow: visible; background: var(--mm-secondary-container); color: var(--mm-on-secondary-container); }
      .mm-split-lead { flex: 1; display: inline-flex; align-items: center; gap: 8px; min-width: 0; padding: 0 8px 0 16px; border: 0; background: transparent; color: inherit; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 9999px 0 0 9999px; }
      .mm-split-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
      .mm-split-lead .ms { font-size: 18px; flex-shrink: 0; }
      .mm-split-trail { display: inline-flex; align-items: center; justify-content: center; width: 48px; flex-shrink: 0; border: 0; border-left: 1px solid var(--mm-outline-variant); background: transparent; color: inherit; cursor: pointer; border-radius: 0 9999px 9999px 0; }
      .mm-split-trail .ms { font-size: 20px; transition: transform .3s cubic-bezier(.2,0,0,1); }
      .mm-split.mm-open { border-radius: 16px; }
      .mm-split.mm-open .mm-split-lead { border-radius: 16px 0 0 16px; }
      .mm-split.mm-open .mm-split-trail { border-radius: 0 16px 16px 0; }
      .mm-split.mm-open .mm-split-trail .ms { transform: rotate(180deg); }
      .mm-split-xs { min-height: 32px; font-size: 12px; }
      .mm-split-xs .mm-split-lead { font-size: 12px; }
      .mm-menu { position: absolute; top: calc(100% + 4px); right: 0; min-width: 100%; max-height: 220px; overflow: auto; z-index: 200; background: var(--mm-surface-high); color: var(--mm-on-surface); border: 1px solid var(--mm-outline-variant); border-radius: 12px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
      .mm-menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; color: inherit; font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
      .mm-menu-item:hover { background: var(--mm-surface-highest); }
      .mm-menu-item.mm-menu-on { background: var(--mm-secondary-container); color: var(--mm-on-secondary-container); }
      .mm-menu-item .ms { font-size: 18px; flex-shrink: 0; }
      .state-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .row { display: flex; gap: 8px; }
      .row .field { flex: 1; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        min-height: 36px; padding: 0 18px; border-radius: 9999px; border: 0; cursor: pointer;
        font: inherit; font-size: 13px; font-weight: 500;
        background: var(--mm-primary); color: var(--mm-on-primary);
      }
      .btn-tonal { background: var(--mm-secondary-container); color: var(--mm-on-secondary-container); }
      .btn-text { background: transparent; color: var(--mm-primary); }
      .btn-danger { background: var(--mm-error-container); color: var(--mm-on-error-container); }
      .btn-sm { min-height: 30px; padding: 0 12px; font-size: 12px; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div id="world">
      <div class="sky">
        <div class="sun"></div>
        <div class="moon"></div>
        <div class="stars" id="stars"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
      </div>
      <div class="ground">
        <svg class="ground-wave" viewBox="0 0 1440 60" preserveAspectRatio="none">
          <path d="M0,32 C240,60 480,0 720,24 C960,48 1200,8 1440,32 L1440,60 L0,60 Z"></path>
        </svg>
        <div class="rock lg" style="left: 8%"></div>
        <div class="rock sm" style="left: 12%"></div>
        <div class="rock md" style="left: 31%"></div>
        <div class="rock sm" style="left: 34%; bottom: 20px"></div>
        <div class="rock lg" style="left: 62%"></div>
        <div class="rock md" style="left: 67%"></div>
        <div class="rock sm" style="left: 82%"></div>
        <div class="rock lg" style="left: 88%"></div>
        <div class="grass-blades" id="grassBlades"></div>
      </div>
      <div id="petLayer"></div>
      <div class="stage-tag">
        <span class="ms">pets</span>
        <div><strong>Mentari Pet Playground</strong><small id="petCount">0 hewan</small></div>
      </div>
      <div class="controls">
        <button class="mm-fab mm-fab-tonal" id="nightButton" title="Siang / malam (N)"><span class="ms">light_mode</span></button>
        <button class="mm-fab" id="configButton" title="Atur hewan"><span class="ms">settings</span><span>Atur</span></button>
      </div>
    </div>

    <div class="scrim" id="configScrim">
      <div class="dialog" role="dialog" aria-label="Pengaturan hewan">
        <h2>Hewan Peliharaan</h2>
        <div class="sub">Pakai GIF per gerakan, atau satu gambar statis untuk semua gerakan. Perubahan tersimpan otomatis di browser ini.</div>
        <div class="field" style="margin-bottom:12px">
          <label for="themeSplit">Tema warna</label>
          <div id="themeSplit"></div>
        </div>
        <div id="petList"></div>
        <div class="row">
          <button class="btn btn-tonal" id="addGifPet"><span class="ms" style="font-size:18px">gif</span> GIF</button>
          <button class="btn btn-tonal" id="addImgPet"><span class="ms" style="font-size:18px">image</span> Gambar</button>
        </div>
        <div class="dialog-actions">
          <button class="btn btn-text" id="resetPets">Reset bawaan</button>
          <button class="btn" id="closeConfig">Selesai</button>
        </div>
      </div>
    </div>

    <script src="pet.js"></script>
  </body>
</html>
