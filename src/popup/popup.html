<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentari Mod</title>
    <style>
      body { width: 232px; margin: 0; background: var(--mm-surface); }
      .pop { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
      .pop-row { display: flex; align-items: center; gap: 8px; }
      .pop-title { flex: 1; font-size: 15px; font-weight: 500; color: var(--mm-on-surface); }
      select {
        width: 100%; font: inherit; font-size: 13px; color: var(--mm-on-surface);
        background: var(--mm-surface-high); border: 1px solid var(--mm-outline);
        border-radius: 8px; padding: 8px 10px; outline: none;
      }
      select:focus { border-color: var(--mm-primary); }
    </style>
  </head>
  <body>
    <div class="pop mm">
      <div class="pop-row">
        <span class="ms" style="color: var(--mm-primary);">pets</span>
        <span class="pop-title">Mentari Mod</span>
      </div>
      <button id="runToken" class="mm-btn" style="width: 100%;">
        <span class="ms">bolt</span> Jalankan
      </button>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label class="mm-label" for="themeSelect">Tema warna</label>
        <select id="themeSelect" class="mm-select"></select>
        <span class="mm-hint">Tersinkron dengan pet stage dan halaman Mentari.</span>
      </div>
    </div>
    <script src="../content/m3.js"></script>
    <script src="script.js"></script>
  </body>
</html>
